spring.application.name=sistema-chamados

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_chamados}
spring.datasource.username=${DB_USERNAME:chamados_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paginação: tamanho padrão 10 e máximo 50 (pedidos maiores são reduzidos para 50)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50