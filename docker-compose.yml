services:
  db:
    image: postgres:17
    container_name: chamados-db
    environment:
      POSTGRES_DB: sistema_chamados
      POSTGRES_USER: ${DB_USERNAME:-chamados_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados_dev}
    volumes:
      - chamados-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: chamados-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sistema_chamados
      DB_USERNAME: ${DB_USERNAME:-chamados_app}
      DB_PASSWORD: ${DB_PASSWORD:-chamados_dev}
    ports:
      - "8080:8080"

volumes:
  chamados-dados:
